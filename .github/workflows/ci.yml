name: Build and syntax check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Check Python syntax
        run: python -m compileall -q backend

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: smart-dynamic-pricing-main/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: smart-dynamic-pricing-main/frontend
        run: npm ci
      - name: Build React app
        working-directory: smart-dynamic-pricing-main/frontend
        run: npm run build
